<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Fondo (safe area para iconos maskable) -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Anillo de progreso -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#0f3460" stroke-width="28" />
  <circle
    cx="256" cy="256" r="150" fill="none"
    stroke="url(#accent)" stroke-width="28" stroke-linecap="round"
    stroke-dasharray="707 943" transform="rotate(-90 256 256)"
  />

  <!-- Letra P -->
  <text
    x="256" y="256"
    font-family="Roboto, system-ui, sans-serif" font-size="170" font-weight="700"
    fill="#ecf0f1" text-anchor="middle" dominant-baseline="central"
  >P</text>
</svg>
